
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: echo "Build completed successfully."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test HTML file
        run: test -f index.html
      - run: echo "Test completed successfully."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "Application deployment simulation completed."
